name: Actualizar EPG

# Publica SOLO la guia. El repositorio no contiene la lista ni ninguna URL
# de streaming: solo ids de canal (ids.txt) y las fuentes publicas de EPG.

on:
  schedule:
    - cron: "0 6 * * *"      # todos los dias 06:00 UTC (03:00 en Chile)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar la guia
        run: |
          python epg-merge.py \
            --ids-file ids.txt \
            --epg "$(paste -sd, epg-sources.txt)" \
            --days 3 \
            --out epg-tv.xml

      - name: Publicar
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg-tv.xml epg-tv.xml.gz
          git commit -m "EPG $(date -u +%Y-%m-%d)" || exit 0
          git push
