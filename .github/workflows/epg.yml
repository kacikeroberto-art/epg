name: Actualizar EPG

on:
  schedule:
    - cron: "0 6 * * *"      # todos los días 06:00 UTC (03:00 en Chile)
  workflow_dispatch:          # tambien a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar la guia
        run: |
          python epg-merge.py \
            --ids-file ids.txt \
            --epg "$(paste -sd, epg-sources.txt)" \
            --out epg.xml

      - name: Publicar en el repositorio
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml epg.xml.gz
          git commit -m "EPG $(date -u +%Y-%m-%d)" || exit 0
          git push
